name: CI Test Suite

on:
  push:
    branches: [ main, cleanup-v2-architecture ]
  pull_request:
    branches:
      - main
      - "release/**"

# Superseded heads of one PR can cancel each other. Main pushes stay independent.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung pytest run fails the job in minutes instead of burning the
    # 6-hour runner default (seen: 50-120 min hangs on PR runs).
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Classify changed paths conservatively
        id: changes
        continue-on-error: true
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_needs_tests.py

      - name: Funding-only change
        if: steps.changes.outputs.run_tests == 'false'
        run: echo 'Funding metadata only; required test job remains successful.'

      - name: Set up Python
        if: steps.changes.outputs.run_tests != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.changes.outputs.run_tests != 'false'
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify JavaScript syntax
        if: steps.changes.outputs.run_tests != 'false'
        timeout-minutes: 1
        run: |
          node -c docs/app.js

      - name: Run Pytest test suite
        if: steps.changes.outputs.run_tests != 'false'
        # The suite passes in well under a minute (healthy runs: 23-39s wall
        # clock). tests/conftest.py fails fast on any test that opens a real
        # network socket, so this step should never approach the timeout.
        #
        # 2026-11-14: two PR runs hung >5 min at the same point (healthy
        # locally on the same Python 3.11.18). The step timeout killed the
        # process with no traceback, so the hang could not be located.
        # pytest-timeout turns any per-test hang into a named failure with a
        # thread-dump traceback; PYTHONUNBUFFERED keeps -v output live so the
        # stop point is trustworthy.
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pip install pytest-timeout
          pytest tests/ -v --timeout=120
